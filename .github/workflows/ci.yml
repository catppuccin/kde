name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
      - name: install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt devscripts
          curl -fsSL https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.0.3/ec-linux-amd64.tar.gz | tar -xz
          sudo install bin/ec-linux-amd64 /usr/local/bin/editorconfig-checker
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz actionlint
          sudo install actionlint /usr/local/bin/actionlint
      - name: shfmt
        run: for f in $(git ls-files '*.sh'); do shfmt -d -ln posix -i 4 -ci "$f"; done
      - name: posix syntax (dash + checkbashisms)
        run: |
          for f in $(git ls-files '*.sh'); do
            dash -n "$f"
            checkbashisms "$f"
          done
      - name: editorconfig
        run: editorconfig-checker
      - name: actionlint
        run: actionlint

  assets:
    name: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: validate json
        run: for f in $(git ls-files '*.json'); do jq empty "$f"; done
      - name: validate svg
        run: for f in $(git ls-files '*.svg'); do xmllint --noout "$f"; done
      - name: validate svgz
        run: |
          for f in $(git ls-files '*.svgz'); do
            gzip -t "$f"
            gzip -dc "$f" | xmllint --noout -
          done

  completeness:
    name: completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: run completeness matrix
        run: tests/completeness.sh

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: run test suite
        run: tests/run.sh

  whiskers-drift:
    name: whiskers-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cache whiskers binary
        id: cache-whiskers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/whiskers
          key: whiskers-${{ runner.os }}-${{ hashFiles('templates/*.tera') }}
      # auto-detects the pinned version from each template's `whiskers.version`
      # frontmatter (the org-wide convention); do not pass whiskers-version.
      - name: setup whiskers
        if: steps.cache-whiskers.outputs.cache-hit != 'true'
        uses: catppuccin/setup-whiskers@b62bd68fffdac4112097d2cf4bc77aba69ee008e # v2
      - name: whiskers --check (drift guard)
        run: |
          for f in templates/*.tera; do
            if grep -q '^[[:space:]]*matrix:' "$f"; then
              whiskers "$f" --check
            else
              example=$(sed -n 's/^[[:space:]]*filename:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' "$f" | head -n1)
              whiskers "$f" --check "$example"
            fi
          done
      - name: generated/ tracked and complete
        run: |
          count=$(git ls-files generated/ | wc -l)
          if [ "$count" -ne 565 ]; then
            echo "::error::expected 565 tracked files under generated/, found $count"
            exit 1
          fi
      - name: name-list provenance
        run: WHISKERS=whiskers tests/provenance.sh

  ci:
    name: ci
    if: always()
    needs: [lint, assets, completeness, tests, whiskers-drift]
    runs-on: ubuntu-latest
    steps:
      - name: verify all jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "dependency results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all required jobs passed"
